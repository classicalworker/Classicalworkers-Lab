name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ① ビルド: APIキーを注入して、Pages用の成果物をアップロードする
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v5

      - name: firebase-config.js にAPIキーを注入
        # ここでのみ、リポジトリの Secrets からAPIキーを読み込み
        # プレースホルダを実際の値に置き換える。
        # 置き換え後のファイルはビルド成果物 (Pages) にのみ含まれ、
        # main ブランチのソースコードには生の値はコミットされない。
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          if [ -z "$FIREBASE_API_KEY" ]; then
            echo "::error::Secrets に FIREBASE_API_KEY が設定されていません。リポジトリの Settings > Secrets and variables > Actions から追加してください。"
            exit 1
          fi
          sed -i "s|__FIREBASE_API_KEY__|${FIREBASE_API_KEY}|g" js/firebase-config.js

      - name: Pages用に成果物をアップロード
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  # ② デプロイ: ビルドとは別のジョブにする
  #    (同じジョブ内だとアップロード直後に成果物を探しに行き、
  #     まだ一覧に反映されておらず「No artifacts named "github-pages"」で失敗することがある)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pagesへデプロイ
        id: deployment
        uses: actions/deploy-pages@v5
